      - PORT=${ODOO_DB_PORT}
      - USER=${ODOO_DB_USER}
      - PASSWORD=${ODOO_DB_PASSWORD}
      - TZ=${TZ}
      # Reverse proxy + SSL
      - VIRTUAL_HOST=${DOMAIN_ODOO18_JUMUAH}
      - LETSENCRYPT_HOST=${DOMAIN_ODOO18_JUMUAH}
      - VIRTUAL_PORT=8069
      - HTTPS_METHOD=redirect
      - PROXY_MODE=True
    volumes:
      - ./data/odoo18:/var/lib/odoo
      - ./addons-local-18:/mnt/extra-addons
      - ./data/config/odoo18-jumuah:/etc/odoo/
