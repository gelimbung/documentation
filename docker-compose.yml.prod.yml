  # Odoo 17 (OLD) – pakai DOMAIN_ODOO_OLD = old.tokojumuah.my.id
  odoo17-jumuah:
    image: odoo:17.0
    container_name: odoo17-jumuah
    depends_on: [db_postgres]
    environment:
      - HOST=${ODOO_DB_HOST}
      - PORT=${ODOO_DB_PORT}
      - USER=${ODOO_DB_USER}
      - PASSWORD=${ODOO_DB_PASSWORD}
      - TZ=${TZ}
      # Reverse proxy + SSL
      - VIRTUAL_HOST=${DOMAIN_ODOO17_JUMUAH}
      - LETSENCRYPT_HOST=${DOMAIN_ODOO17_JUMUAH}
      - VIRTUAL_PORT=8069
    volumes:
      - ./data/odoo17:/var/lib/odoo
      - ./addons-local-17:/mnt/extra-addons
      - ./data/config/odoo17-jumuah:/etc/odoo/
    networks:
      webnet:
        aliases: [odoo17-jumuah]

    restart: "no"

  # Database untuk aplikasi PHP
  mysql:
    image: mysql:8.4.7
    container_name: mysql
    #command: --default-authentication-plugin=caching_sha2_password
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks: [webnet]
    restart: always

  # Web PHP sederhana (nginx+php-fpm dalam 1 image)
  phpapp:
    image: trafex/php-nginx:latest
    container_name: phpapp
    environment:
      - VIRTUAL_HOST=${DOMAIN_PHP}
      - LETSENCRYPT_HOST=${DOMAIN_PHP}
      - VIRTUAL_PORT=8080
      - PHP_ERRORS_STDERR=1
      - TZ=${TZ}
    volumes:
      - ./php/html:/var/www/html
    depends_on: [mysql]
    networks: [webnet]
    restart: "no"

  #adminer
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    expose:
      - "8080"
    environment:
      - VIRTUAL_HOST=${ADMINER_DOMAIN}
      - VIRTUAL_PORT=${ADMINER_PORT}
      - LETSENCRYPT_HOST=${ADMINER_DOMAIN}
      - ADMINER_DEFAULT_SERVER=mysql
      - TZ=Asia/Jakarta
    networks:
      - webnet

  #ekasir_sinar
  php-ekasir:
    image: webdevops/php-nginx:7.4
    container_name: php-ekasir
    environment:
      - VIRTUAL_HOST=${DOMAIN_SINAR_EKASIR}
      - LETSENCRYPT_HOST=${DOMAIN_SINAR_EKASIR}
      - VIRTUAL_PORT=80
      - TZ=${TZ}
    volumes:
      - ./php/sinar_ekasir:/app
    depends_on: [mysql]
    networks: [webnet]
    restart: always

  #web_sinar
  php-websinar:
    image: webdevops/php-nginx:8.1
    container_name: php-websinar
    environment:
      - VIRTUAL_HOST=${DOMAIN_SINAR_ROOT}
      - LETSENCRYPT_HOST=${DOMAIN_SINAR_ROOT}
      - VIRTUAL_PORT=80
      - TZ=${TZ}
    volumes:
      - ./php/sinar_web:/app
    depends_on: [mysql]
    networks: [webnet]
    restart: always

    # Laravel PHP 8.4 (Akuntansi Sadean)
  akuntansi-sadean:
    image: webdevops/php-nginx:8.4
    container_name: laravel-akuntansi
    environment:
      - VIRTUAL_HOST=${DOMAIN_AKUNTANSI_SADEAN}
      - LETSENCRYPT_HOST=${DOMAIN_AKUNTANSI_SADEAN}
      - VIRTUAL_PORT=80
      - WEB_DOCUMENT_ROOT=/app/public
      - TZ=${TZ}
      - PHP_UPLOAD_MAX_FILESIZE=64M
      - PHP_POST_MAX_SIZE=64M
      - TRUSTED_PROXIES=*
      - APP_URL=https://${DOMAIN_AKUNTANSI_SADEAN}
      - ASSET_URL=https://${DOMAIN_AKUNTANSI_SADEAN}
    volumes:
      - ./php/akuntansi_sadean:/app
    depends_on: [db_postgres]
    networks:
      - webnet
    restart: always


networks:
  webnet:
    driver: bridge 

volumes:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  #portainer_data:
