services:
  # Reverse proxy otomatis + SSL
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TRUST_DOWNSTREAM_PROXY=true
    volumes:
      - nginx_certs:/etc/nginx/certs:ro
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks: [webnet]
    restart: always

  acme-companion:
    image: nginxproxy/acme-companion:2.4
    container_name: acme-companion
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL}
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - nginx_certs:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [nginx-proxy]
    networks: [webnet]
    restart: always

  # Database Odoo
  db_postgres:
    image: postgres:16
    container_name: db_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TZ}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [webnet]
    restart: always

# Odoo 18 (sadean))
  odoo18-sadean:
    image: odoo:18.0
    build: . 
    container_name: odoo18-sadean
    depends_on: [db_postgres]
    environment:
      - HOST=${ODOO_DB_HOST}
      - PORT=${ODOO_DB_PORT}
      - USER=${ODOO_DB_USER}
      - PASSWORD=${ODOO_DB_PASSWORD}
      - TZ=${TZ}
      # Reverse proxy + SSL
      - VIRTUAL_HOST=${DOMAIN_ROOT_SADEAN}
      - LETSENCRYPT_HOST=${DOMAIN_ROOT_SADEAN}
      - VIRTUAL_PORT=8069
    volumes:
      - ./data/odoo18:/var/lib/odoo
      - ./addons-local-18:/mnt/extra-addons
      - ./data/config/odoo18-sadean:/etc/odoo/
    networks: 
      webnet:
        aliases: [odoo18-sadean]
    restart: always

  # Odoo 18 (community)
